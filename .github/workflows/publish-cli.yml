name: Publish CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step but publish with --dry-run"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish @jtdeelux/plane-cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@jtdeelux/plane-cli...

      - name: Test
        run: pnpm --filter=@jtdeelux/plane-cli test

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if [ "$TAG" != "cli-v$version" ]; then
            echo "Tag $TAG does not match apps/cli/package.json version $version" >&2
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "A real publish needs a tag ref; run with dry_run=true or from a cli-v* tag" >&2
            exit 1
          fi
          flags="--provenance --access public --no-git-checks"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          pnpm publish --filter=@jtdeelux/plane-cli $flags
